[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "exu-base"
version = "0.1.0"
description = "Exu: train encoder-only models that answer typed questions with calibrated probability distributions, not generated text"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rui Valim" }]
keywords = [
  "calibration",
  "decision-making",
  "proper-scoring-rules",
  "reinforcement-learning",
  "rlcd",
  "exu",
  "encoder",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "safetensors>=0.5",
  "torch>=2.4",
  "transformers>=4.48",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/ruivalim/exu-base"
Documentation = "https://ruivalim.github.io/exu-base/"
Issues = "https://github.com/ruivalim/exu-base/issues"
Changelog = "https://github.com/ruivalim/exu-base/blob/main/CHANGELOG.md"

[project.scripts]
exu-train = "exu.train:main"
exu-evaluate = "exu.evaluate:main"
exu-decide = "exu.decide:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exu"]

# A dataset or a checkpoint must never leave this machine inside a distribution:
# PyPI uploads cannot be undone, and a local `uv publish` builds from the working
# tree, where `data/` and a stray root-level JSONL are not version controlled and
# therefore not ignored by the builder.
[tool.hatch.build.targets.sdist]
exclude = [
  "/data",
  "/artifacts",
  "/runs",
  "/_site",
  "/dist",
  "/graft",
  "/*.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
