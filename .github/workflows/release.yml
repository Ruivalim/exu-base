name: Release

# Publishes to PyPI using trusted publishing: GitHub mints a short-lived OIDC
# token, so there is no API token stored in this repository. The matching
# publisher is configured on PyPI (project exu-base, this repository, this
# workflow file, environment "pypi").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/exu-base
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      # A published version can be yanked but never replaced, so nothing reaches
      # PyPI without passing the same check CI runs.
      - name: Lint, test and build
        run: make check
      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          version=$(uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tagged" ]; then
            echo "pyproject.toml says $version but the tag says $tagged" >&2
            exit 1
          fi
          echo "tag v$tagged matches the project version"
      - name: Publish
        run: uv publish --trusted-publishing always
