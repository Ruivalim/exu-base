name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior, with the exact error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Command, config and a data snippet small enough to run.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are on, or the `rlcd` version in `pyproject.toml`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, torch version, GPU or CPU.
    validations:
      required: true
